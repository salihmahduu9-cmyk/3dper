<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>3D Product Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;

      /* شفافية كاملة حتى تظهر خلفية Framer */
      background: transparent;
    }

    body {
      touch-action: none;
    }

    canvas {
      display: block;

      width: 100%;
      height: 100%;

      background: transparent;
    }

    #loading {
      position: fixed;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      color: rgba(255, 255, 255, 0.9);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 13px;

      letter-spacing: 1px;

      pointer-events: none;

      z-index: 10;

      transition:
        opacity 0.4s ease;
    }

    #error {
      position: fixed;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      text-align: center;

      display: none;

      z-index: 20;
    }
  </style>
</head>

<body>

  <div id="loading">
    جاري تحميل المنتج...
  </div>

  <div id="error">
    تعذر تحميل الموديل 3D
  </div>


  <!--
    Three.js
  -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
    }
  }
  </script>


  <script type="module">

    import * as THREE from "three";

    import {
      GLTFLoader
    } from "three/addons/loaders/GLTFLoader.js";

    import {
      OrbitControls
    } from "three/addons/controls/OrbitControls.js";


    // ==================================================
    // SCENE
    // ==================================================

    const scene =
      new THREE.Scene();


    // ==================================================
    // CAMERA
    // ==================================================

    const camera =
      new THREE.PerspectiveCamera(
        35,
        window.innerWidth /
        window.innerHeight,
        0.01,
        1000
      );


    camera.position.set(
      0,
      0.2,
      5
    );


    // ==================================================
    // RENDERER
    // ==================================================

    const renderer =
      new THREE.WebGLRenderer({

        antialias: true,

        alpha: true,

        powerPreference: "high-performance"

      });


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );


    // مهم جداً للشفافية

    renderer.setClearColor(
      0x000000,
      0
    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
      1.25;


    renderer.shadowMap.enabled =
      false;


    document.body.appendChild(
      renderer.domElement
    );


    // ==================================================
    // LIGHTING
    // إضاءة سماوية + زرقاء فاتحة
    // ==================================================


    // Ambient
    // إضاءة عامة ناعمة

    const ambientLight =
      new THREE.AmbientLight(
        0xdffaff,
        2.2
      );

    scene.add(
      ambientLight
    );


    // ==================================================
    // KEY LIGHT
    // سماوي فاتح
    // ==================================================

    const keyLight =
      new THREE.DirectionalLight(
        0xbdefff,
        4.5
      );


    keyLight.position.set(
      4,
      6,
      5
    );


    scene.add(
      keyLight
    );


    // ==================================================
    // FILL LIGHT
    // أزرق فاتح
    // ==================================================

    const fillLight =
      new THREE.DirectionalLight(
        0x9fdcff,
        3.5
      );


    fillLight.position.set(
      -5,
      2,
      4
    );


    scene.add(
      fillLight
    );


    // ==================================================
    // RIM LIGHT
    // سماوي مشرق من الخلف
    // ==================================================

    const rimLight =
      new THREE.DirectionalLight(
        0x8fe9ff,
        4
      );


    rimLight.position.set(
      2,
      4,
      -6
    );


    scene.add(
      rimLight
    );


    // ==================================================
    // SOFT TOP LIGHT
    // ==================================================

    const topLight =
      new THREE.PointLight(
        0xc7f5ff,
        2.5,
        10
      );


    topLight.position.set(
      0,
      5,
      2
    );


    scene.add(
      topLight
    );


    // ==================================================
    // CONTROLS
    // ==================================================

    const controls =
      new OrbitControls(
        camera,
        renderer.domElement
      );


    controls.enableDamping =
      true;


    controls.dampingFactor =
      0.055;


    // دوران بالسحب

    controls.enableRotate =
      true;


    // Zoom

    controls.enableZoom =
      true;


    // منع التحريك الجانبي

    controls.enablePan =
      false;


    // حدود الدوران العمودي

    controls.minPolarAngle =
      0.45;


    controls.maxPolarAngle =
      Math.PI - 0.45;


    // حدود Zoom

    controls.minDistance =
      1.5;


    controls.maxDistance =
      4;


    // ==================================================
    // MODEL
    // ==================================================

    const loader =
      new GLTFLoader();


    const MODEL_URL =
      "https://raw.githubusercontent.com/salihmahduu9-cmyk/3dper/refs/heads/main/jean-paul_gaultier_le_male_bottle.glb";


    loader.load(

      MODEL_URL,


      // =================================================
      // SUCCESS
      // =================================================

      function (gltf) {

        const model =
          gltf.scene;


        scene.add(
          model
        );


        // ==============================================
        // CALCULATE MODEL SIZE
        // ==============================================

        const box =
          new THREE.Box3()
            .setFromObject(
              model
            );


        const size =
          box.getSize(
            new THREE.Vector3()
          );


        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        // ==============================================
        // CENTER MODEL
        // ==============================================

        model.position.x -=
          center.x;


        model.position.y -=
          center.y;


        model.position.z -=
          center.z;


        // ==============================================
        // SCALE MODEL
        // ==============================================

        const maxSize =
          Math.max(
            size.x,
            size.y,
            size.z
          );


        const targetSize =
          3.2;


        const scale =
          targetSize /
          maxSize;


        model.scale.setScalar(
          scale
        );


        // ==============================================
        // CENTER AGAIN
        // ==============================================

        const newBox =
          new THREE.Box3()
            .setFromObject(
              model
            );


        const newCenter =
          newBox.getCenter(
            new THREE.Vector3()
          );


        model.position.sub(
          newCenter
        );


        // ==============================================
        // MATERIAL SETTINGS
        // ==============================================

        model.traverse(
          function (object) {

            if (
              object.isMesh
            ) {

              object.castShadow =
                false;


              object.receiveShadow =
                false;


              if (
                object.material
              ) {

                object.material
                  .needsUpdate =
                  true;

              }

            }

          }
        );


        // ==============================================
        // CAMERA
        // ==============================================

        camera.position.set(
          0,
          0.15,
          5
        );


        controls.target.set(
          0,
          0,
          0
        );


        controls.update();


        // ==============================================
        // HIDE LOADING
        // ==============================================

        const loading =
          document.getElementById(
            "loading"
          );


        loading.style.opacity =
          "0";


        setTimeout(
          function () {

            loading.style.display =
              "none";

          },
          400
        );


        // ==============================================
        // AUTO ROTATION
        // ==============================================

        let autoRotate =
          true;


        let resumeTimer;


        // ==============================================
        // ANIMATION
        // ==============================================

        function animate() {

          requestAnimationFrame(
            animate
          );


          // دوران تلقائي خفيف

          if (
            autoRotate
          ) {

            model.rotation.y +=
              0.0025;

          }


          controls.update();


          renderer.render(
            scene,
            camera
          );

        }


        animate();


        // ==============================================
        // USER INTERACTION
        // ==============================================

        controls.addEventListener(
          "start",
          function () {

            autoRotate =
              false;


            clearTimeout(
              resumeTimer
            );

          }
        );


        controls.addEventListener(
          "end",
          function () {

            clearTimeout(
              resumeTimer
            );


            resumeTimer =
              setTimeout(
                function () {

                  autoRotate =
                    true;

                },
                2500
              );

          }
        );

      },


      // =================================================
      // LOADING PROGRESS
      // =================================================

      function (xhr) {

        if (
          xhr.total
        ) {

          const percent =
            (
              xhr.loaded /
              xhr.total
            ) * 100;


          document.getElementById(
            "loading"
          ).textContent =
            "جاري التحميل " +
            Math.round(
              percent
            ) +
            "%";

        }

      },


      // =================================================
      // ERROR
      // =================================================

      function (error) {

        console.error(
          "GLB Loading Error:",
          error
        );


        document.getElementById(
          "loading"
        ).style.display =
          "none";


        document.getElementById(
          "error"
        ).style.display =
          "block";

      }

    );


    // ==================================================
    // RESPONSIVE
    // ==================================================

    window.addEventListener(
      "resize",
      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );


        renderer.setPixelRatio(
          Math.min(
            window.devicePixelRatio,
            2
          )
        );

      }
    );

  </script>

</body>
</html>
