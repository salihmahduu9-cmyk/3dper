<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>3D Product Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    #loading {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: rgba(255,255,255,0.85);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 13px;
      letter-spacing: 1px;

      pointer-events: none;
      z-index: 10;

      transition: opacity 0.4s ease;
    }

    #error {
      position: fixed;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      color: white;

      font-family: Arial, sans-serif;

      text-align: center;

      display: none;

      z-index: 20;
    }
  </style>
</head>

<body>

<div id="loading">
  جاري تحميل المنتج...
</div>

<div id="error">
  تعذر تحميل الموديل 3D
</div>


<script type="importmap">
{
  "imports": {
    "three":
      "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",

    "three/addons/":
      "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
  }
}
</script>


<script type="module">

import * as THREE from "three";

import {
  GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


// =====================================================
// SCENE
// =====================================================

const scene =
  new THREE.Scene();


// =====================================================
// CAMERA
// =====================================================

const camera =
  new THREE.PerspectiveCamera(
    32,
    window.innerWidth /
    window.innerHeight,
    0.01,
    1000
  );

camera.position.set(
  0,
  0,
  5
);


// =====================================================
// RENDERER
// =====================================================

const renderer =
  new THREE.WebGLRenderer({

    antialias: true,

    alpha: true,

    powerPreference:
      "high-performance"

  });


renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);


// شفافية كاملة

renderer.setClearColor(
  0x000000,
  0
);


// ألوان واقعية

renderer.outputColorSpace =
  THREE.SRGBColorSpace;


// Tone Mapping

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
  1.15;


document.body.appendChild(
  renderer.domElement
);


// =====================================================
// LIGHTING
// سماوي + أزرق فاتح
// =====================================================


// إضاءة عامة

const ambient =
  new THREE.HemisphereLight(
    0xdffaff,
    0x193450,
    2.4
  );

scene.add(
  ambient
);


// الضوء الرئيسي

const key =
  new THREE.DirectionalLight(
    0xc8f5ff,
    5
  );

key.position.set(
  4,
  6,
  5
);

scene.add(
  key
);


// الضوء الجانبي

const fill =
  new THREE.DirectionalLight(
    0x9edfff,
    3.5
  );

fill.position.set(
  -5,
  2,
  4
);

scene.add(
  fill
);


// الضوء الخلفي

const rim =
  new THREE.DirectionalLight(
    0x7ee8ff,
    5
  );

rim.position.set(
  3,
  4,
  -6
);

scene.add(
  rim
);


// الضوء العلوي

const top =
  new THREE.PointLight(
    0xd9faff,
    3,
    12
  );

top.position.set(
  0,
  6,
  2
);

scene.add(
  top
);


// =====================================================
// LOAD MODEL
// =====================================================

const loader =
  new GLTFLoader();


const MODEL_URL =
  "https://raw.githubusercontent.com/salihmahduu9-cmyk/3dper/refs/heads/main/jean-paul_gaultier_le_male_bottle.glb";


loader.load(

  MODEL_URL,


  // ===================================================
  // SUCCESS
  // ===================================================

  function(gltf) {

    const model =
      gltf.scene;


    scene.add(
      model
    );


    // =================================================
    // CALCULATE ORIGINAL SIZE
    // =================================================

    const box =
      new THREE.Box3()
        .setFromObject(
          model
        );


    const size =
      box.getSize(
        new THREE.Vector3()
      );


    const center =
      box.getCenter(
        new THREE.Vector3()
      );


    // =================================================
    // CENTER
    // =================================================

    model.position.sub(
      center
    );


    // =================================================
    // SCALE
    //
    // الحجم الأساسي السابق كان 3.25
    // الآن نقسمه على 6
    //
    // =================================================

    const originalTargetSize =
      3.25;


    const reducedTargetSize =
      originalTargetSize / 6;


    const maxSize =
      Math.max(
        size.x,
        size.y,
        size.z
      );


    const scale =
      reducedTargetSize /
      maxSize;


    model.scale.setScalar(
      scale
    );


    // =================================================
    // CENTER AFTER SCALE
    // =================================================

    const newBox =
      new THREE.Box3()
        .setFromObject(
          model
        );


    const newCenter =
      newBox.getCenter(
        new THREE.Vector3()
      );


    model.position.sub(
      newCenter
    );


    // =================================================
    // MATERIALS
    // =================================================

    model.traverse(
      function(object) {

        if (
          object.isMesh
        ) {

          object.castShadow =
            false;

          object.receiveShadow =
            false;


          if (
            object.material
          ) {

            object.material.needsUpdate =
              true;


            // المحافظة على الخامة الأصلية
            // مع تحسين الإضاءة

            if (
              "envMapIntensity"
              in object.material
            ) {

              object.material.envMapIntensity =
                1.4;

            }

          }

        }

      }
    );


    // =================================================
    // LOADING OFF
    // =================================================

    const loading =
      document.getElementById(
        "loading"
      );


    loading.style.opacity =
      "0";


    setTimeout(
      function() {

        loading.style.display =
          "none";

      },
      400
    );


    // =================================================
    // ROTATION
    //
    // X فقط
    // Y = 0
    // Z = 0
    // =================================================

    model.rotation.x =
      0;

    model.rotation.y =
      0;

    model.rotation.z =
      0;


    // =================================================
    // AUTO ROTATION
    // =================================================

    let autoRotate =
      true;


    let resumeTimer;


    const rotationSpeed =
      0.003;


    // =================================================
    // DRAG
    // =================================================

    let dragging =
      false;


    let lastY =
      0;


    renderer.domElement.addEventListener(
      "pointerdown",
      function(event) {

        dragging =
          true;


        autoRotate =
          false;


        lastY =
          event.clientY;


        renderer.domElement.setPointerCapture(
          event.pointerId
        );

      }
    );


    renderer.domElement.addEventListener(
      "pointermove",
      function(event) {

        if (
          !dragging
        ) {
          return;
        }


        const deltaY =
          event.clientY -
          lastY;


        lastY =
          event.clientY;


        // ==========================================
        // X ONLY
        // ==========================================

        model.rotation.x +=
          deltaY * 0.008;


        // ==========================================
        // LOCK Y & Z
        // ==========================================

        model.rotation.y =
          0;

        model.rotation.z =
          0;

      }
    );


    function stopDragging() {

      dragging =
        false;


      clearTimeout(
        resumeTimer
      );


      resumeTimer =
        setTimeout(
          function() {

            autoRotate =
              true;

          },
          2500
        );

    }


    renderer.domElement.addEventListener(
      "pointerup",
      stopDragging
    );


    renderer.domElement.addEventListener(
      "pointercancel",
      stopDragging
    );


    // =================================================
    // ZOOM
    //
    // الحد الأدنى = 1.5
    // الحد الأقصى = 3
    //
    // =================================================

    let cameraZoom =
      2.25;


    const MIN_ZOOM =
      1.5;


    const MAX_ZOOM =
      3;


    camera.position.z =
      cameraZoom;


    renderer.domElement.addEventListener(
      "wheel",
      function(event) {

        event.preventDefault();


        cameraZoom +=
          event.deltaY * 0.002;


        cameraZoom =
          THREE.MathUtils.clamp(
            cameraZoom,
            MIN_ZOOM,
            MAX_ZOOM
          );


        camera.position.z =
          cameraZoom;

      },
      {
        passive: false
      }
    );


    // =================================================
    // MOBILE PINCH ZOOM
    // =================================================

    let initialPinchDistance =
      null;


    let initialCameraZoom =
      cameraZoom;


    renderer.domElement.addEventListener(
      "touchstart",
      function(event) {

        if (
          event.touches.length === 2
        ) {

          const dx =
            event.touches[0].clientX -
            event.touches[1].clientX;


          const dy =
            event.touches[0].clientY -
            event.touches[1].clientY;


          initialPinchDistance =
            Math.sqrt(
              dx * dx +
              dy * dy
            );


          initialCameraZoom =
            cameraZoom;

        }

      },
      {
        passive: false
      }
    );


    renderer.domElement.addEventListener(
      "touchmove",
      function(event) {

        if (
          event.touches.length === 2 &&
          initialPinchDistance
        ) {

          event.preventDefault();


          const dx =
            event.touches[0].clientX -
            event.touches[1].clientX;


          const dy =
            event.touches[0].clientY -
            event.touches[1].clientY;


          const distance =
            Math.sqrt(
              dx * dx +
              dy * dy
            );


          const difference =
            distance -
            initialPinchDistance;


          cameraZoom =
            THREE.MathUtils.clamp(
              initialCameraZoom -
              difference * 0.01,
              MIN_ZOOM,
              MAX_ZOOM
            );


          camera.position.z =
            cameraZoom;

        }

      },
      {
        passive: false
      }
    );


    renderer.domElement.addEventListener(
      "touchend",
      function(event) {

        if (
          event.touches.length < 2
        ) {

          initialPinchDistance =
            null;

        }

      }
    );


    // =================================================
    // ANIMATION
    // =================================================

    function animate() {

      requestAnimationFrame(
        animate
      );


      // الدوران التلقائي
      // X فقط

      if (
        autoRotate &&
        !dragging
      ) {

        model.rotation.x +=
          rotationSpeed;

      }


      // =================================================
      // FORCE LOCK
      // =================================================

      model.rotation.y =
        0;


      model.rotation.z =
        0;


      renderer.render(
        scene,
        camera
      );

    }


    animate();

  },


  // ===================================================
  // LOADING
  // ===================================================

  function(xhr) {

    if (
      xhr.total
    ) {

      const percent =
        (
          xhr.loaded /
          xhr.total
        ) * 100;


      document.getElementById(
        "loading"
      ).textContent =
        "جاري التحميل " +
        Math.round(
          percent
        ) +
        "%";

    }

  },


  // ===================================================
  // ERROR
  // ===================================================

  function(error) {

    console.error(
      "GLB Error:",
      error
    );


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "error"
    ).style.display =
      "block";

  }

);


// =====================================================
// RESPONSIVE
// =====================================================

window.addEventListener(
  "resize",
  function() {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );

  }
);

</script>

</body>
</html>
